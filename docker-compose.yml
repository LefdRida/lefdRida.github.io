services:
  jekyll:
    image: ruby:3.3
    working_dir: /srv/jekyll
    command: sh -c "bundle install && bundle exec jekyll serve --host 0.0.0.0 --livereload --force_polling"
    ports:
      - "8080:4000"
      - "35729:35729"
    volumes:
      - .:/srv/jekyll
      - bundle:/usr/local/bundle
    environment:
      BUNDLE_PATH: /usr/local/bundle

volumes:
  bundle:
