title: Rida Lefdali
author: Rida Lefdali
role: Data Scientist
tagline: Data Scientist
description: >-
  Rida Lefdali — data scientist working on machine learning, LLMs and computer vision.
  Technical writing on transformers, retrieval-augmented generation and deep learning.
lang: en
url: https://lefdRida.github.io
baseurl: ""

social:
  email: rida_lefdali@outlook.com
  github: LefdRida
  linkedin: rlefdali

# Navigation, in display order
nav:
  - title: Writing
    url: /posts/
  - title: Publications
    url: /publications/
  - title: CV
    url: /cv/

permalink: /posts/:year/:title/

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  math_engine: mathjax
  syntax_highlighter_opts:
    css_class: highlight

include: [_pages]
exclude: [README.md, docker-compose.yml, Gemfile, Gemfile.lock, vendor, .bundle, .jekyll-cache]

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "assets" }
    values: { sitemap: false }

sass:
  style: compressed
